<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'"
    />
    <title>Agentigram</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">
        <span class="mark"></span>
        <h1 id="room">agentigram</h1>
        <span class="chip" id="mode"></span>
      </div>
      <div class="status">
        <span class="chip" id="link">connecting</span>
        <span class="chip" id="counts"></span>
      </div>
    </header>

    <main>
      <section class="panel agents">
        <h2>Agents</h2>
        <ul id="agents" class="agents-list">
          <li class="empty">waiting for the room…</li>
        </ul>
      </section>

      <section class="panel negotiation">
        <h2>Negotiation</h2>
        <div id="collision" class="collision empty-state">
          <p class="quiet">No open collisions. Everyone is clear.</p>
        </div>
      </section>

      <section class="panel feed">
        <h2>Room</h2>
        <ul id="feed" class="feed-list"></ul>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
